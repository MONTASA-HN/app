<script>
// ══ ACTUALIZACIÓN AUTOMÁTICA DE LA APP ════════════════════════════════════════
// El iPhone guarda su propia copia de la app instalada y a veces sigue mostrando la
// versión vieja aunque ya se publicó una nueva. Al abrir la app y al volver a ella,
// se compara APP_VERSION con version.json (pedido sin caché); si hay una más nueva,
// la app se recarga sola con ?v=<versión> para obligar al teléfono a bajarla.
// NUNCA recarga si el usuario ya tocó un campo, la firma o la cámara en esta sesión:
// abrir la cámara o salir a WhatsApp también cuenta como "volver a la app", y
// recargar ahí borraría lo que estaba llenando. En ese caso la actualización espera
// a la próxima vez que se abra la app.
// APP_VERSION la pone dev/sellar_version.js; no editarla a mano.
(function(){
  var APP_VERSION='484b3bc097e2';
  window._nxVersion = APP_VERSION;   // (2026-10-31) para el historial de entradas
  if(!/^https?:$/.test(location.protocol) || !window.fetch) return;
  var archivo = location.pathname.split('/').pop();
  if(!archivo) return;
  var tocado = false;
  function marcar(e){
    var t = e.target, n = t && t.tagName;
    if(n==='INPUT' || n==='TEXTAREA' || n==='SELECT' || n==='CANVAS') tocado = true;
  }
  document.addEventListener('focusin', marcar, true);
  document.addEventListener('pointerdown', marcar, true);
  document.addEventListener('touchstart', marcar, {capture:true, passive:true});
  document.addEventListener('input', function(){ tocado = true; }, true);
  var revisando = false;
  function revisar(){
    if(revisando || tocado) return;
    revisando = true;
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(v){
        revisando = false;
        var nueva = v && v[archivo];
        if(!nueva || nueva === APP_VERSION || tocado) return;
        // Si ya se intentó esta misma versión hace poco y seguimos en la vieja (GitHub
        // aún no la termina de publicar), no insistir: evita recargas en cadena.
        var k = '_actualizar_' + archivo, antes = null;
        try{ antes = JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){}
        if(antes && antes.v === nueva && Date.now() - antes.ts < 5*60*1000) return;
        try{ localStorage.setItem(k, JSON.stringify({v:nueva, ts:Date.now()})); }catch(e){}
        location.replace(location.pathname + '?v=' + encodeURIComponent(nueva) + location.hash);
      })
      .catch(function(){ revisando = false; });
  }
  revisar();
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') revisar();
  });
  window.addEventListener('pageshow', function(e){ if(e.persisted) revisar(); });
})();
</script>

  // ══ AUSENCIAS PARA LAS APPS (2026-11-19, Miguel: incapacitados y de vacaciones no se pueden escoger en órdenes) ══════════════

  function sincAus(){
    var falta = []; EMPRESAS.forEach(function(E){ ['incapacidades', 'acciones', 'colaboradores'].forEach(function(k){ if(!D[E.raiz]._ok[k]) falta.push(E.raiz + '/' + k); }); });

    var h = hoy(), quiero = {};
    // solo se maneja lo que este equipo puede leer (Gerencia no lee incapacidades: no debe borrar las de RRHH)
    var puede = { inc: EMPRESAS.every(function(E){ return !(D[E.raiz]._sinAcceso || {}).incapacidades; }), vac: EMPRESAS.every(function(E){ var x = D[E.raiz]._sinAcceso || {}; return !x.acciones && !x.colaboradores; }) };

      if(puede.vac) lista(D[rf].acciones).forEach(function(a){ if(!a.id || a.anulada || !(a.descuentaVacaciones === true || a.descuentaVacaciones === 'true') || !a.desde || !a.hasta) return;
