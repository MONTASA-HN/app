<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#173a5c">
<title>MONHACO · Logística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f4f3ee; --surface:#ffffff; --surface2:#f0efe9;
  --border:#e7e5dc; --border2:#dcd9cf;
  --text:#1a1a18; --text2:#55534b; --text3:#9c9a90;
  --accent:#1f3864; --radius:14px; --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:30px}
.app-header{background:linear-gradient(135deg,#173a5c 0%,#1f5488 100%);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:50}
.app-header .fila{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:680px;margin:0 auto}
.contenido{max-width:680px;margin:0 auto;padding:14px 14px 0}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.seg button.on{border-color:#1f3864;background:#1f3864;color:#fff;font-weight:700}
#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;border-radius:20px;padding:9px 18px;font-size:13px;font-weight:600;z-index:99999;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
input,textarea,select,button{font-family:inherit}
/* PIN */
#pin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:900;align-items:center;justify-content:center;padding:24px}
#pin-overlay.open{display:flex}
.pin-box{background:#fff;border-radius:16px;padding:22px;max-width:320px;width:100%;text-align:center}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:14px 0}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #1f3864;background:transparent}
.pin-dot.filled{background:#1f3864}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-grid button{padding:14px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);font-size:18px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<div class="app-header">
  <div class="fila">
    <div>
      <div style="font-size:17px;font-weight:800;letter-spacing:-0.2px">MONHACO · Logística</div>
      <div id="hdr-fecha" style="font-size:12px;opacity:0.8;margin-top:2px"></div>
    </div>
    <div style="background:#fff;border-radius:8px;padding:4px 8px"><img id="hdr-logo" style="height:34px;display:block" alt="MONTASA"></div>
  </div>
</div>

<div class="contenido">
  <div class="seg">
    <button id="seg-hor" class="on" onclick="lgVista('hor')">📟 Horómetros</button>
    <button id="seg-rc" onclick="lgVista('rc')">💰 Cobros</button>
  </div>
  <div id="hor-cont"></div>
  <div id="rc-cont" style="display:none"></div>
  <div id="lg-cargando" style="text-align:center;color:var(--text3);font-size:13px;padding:20px 0">Conectando con la base de datos…</div>
</div>

<div id="toast"></div>

<div id="pin-overlay">
  <div class="pin-box">
    <div id="pin-title" style="font-weight:800;color:#1f3864;font-size:16px">Acceso restringido</div>
    <div id="pin-sub" style="font-size:12px;color:var(--text3);margin-top:4px">Ingresa tu PIN</div>
    <div class="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div>
    <div id="pin-error" style="color:#c00;font-size:12px;font-weight:700;min-height:16px"></div>
    <div class="pin-grid">
      <button onclick="pinKey('1')">1</button><button onclick="pinKey('2')">2</button><button onclick="pinKey('3')">3</button>
      <button onclick="pinKey('4')">4</button><button onclick="pinKey('5')">5</button><button onclick="pinKey('6')">6</button>
      <button onclick="pinKey('7')">7</button><button onclick="pinKey('8')">8</button><button onclick="pinKey('9')">9</button>
      <button onclick="pinBorrar()">⌫</button><button onclick="pinKey('0')">0</button><button onclick="pinCancelar()">✕</button>
    </div>
  </div>
</div>

const DB = { equipos: [], preventivos: [], correctivos: [], horometros: {}, cobros: {} };
function _toArr(x){ if(!x) return []; return (Array.isArray(x)?x:Object.values(x)).filter(Boolean); }
let _toastTimer = null;
function toast(msg, err){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.style.background = err ? '#a02020' : '#1a1a18'; t.style.opacity = '1';
  clearTimeout(_toastTimer); _toastTimer = setTimeout(function(){ t.style.opacity = '0'; }, 2600);
}
(function(){
  const now = new Date();
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const el = document.getElementById('hdr-fecha');
  if(el) el.textContent = dias[now.getDay()]+' '+now.getDate()+' de '+meses[now.getMonth()]+' '+now.getFullYear();
})();

const PIN_CORRECTO = '1624';
let pinActual = '', pinCallback = null;
function actualizarPinDots(){ for(let i=0;i<4;i++){ const d=document.getElementById('pd'+i); if(d) d.classList.toggle('filled', i<pinActual.length); } }
function solicitarPINAccion(callback, titulo, subtitulo){
  pinActual=''; pinCallback=callback; actualizarPinDots();
  document.getElementById('pin-error').textContent='';
  document.getElementById('pin-title').textContent = titulo||'Acceso restringido';
  document.getElementById('pin-sub').textContent = subtitulo||'Ingresa tu PIN';
  document.getElementById('pin-overlay').classList.add('open');
}
function pinKey(n){
  if(pinActual.length>=4) return;
  pinActual+=n; actualizarPinDots();
  if(pinActual.length===4){
    setTimeout(function(){
      if(pinActual===PIN_CORRECTO){
        document.getElementById('pin-overlay').classList.remove('open');
        const cb=pinCallback; pinCallback=null; pinActual='';
        if(cb) cb();
      } else {
        document.getElementById('pin-error').textContent='PIN incorrecto';
        pinActual=''; actualizarPinDots();
      }
    }, 120);
  }
}
function pinBorrar(){ pinActual=pinActual.slice(0,-1); actualizarPinDots(); }
function pinCancelar(){ pinActual=''; pinCallback=null; document.getElementById('pin-overlay').classList.remove('open'); }

// ── COMPARTIR IMAGEN ─────────────────────────────────────────────────────────
function _cargarHtml2Canvas(){
  if(window.html2canvas) return Promise.resolve();
  return new Promise(function(res, rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=res; s.onerror=function(){ rej(new Error('sin conexión para cargar el generador')); };
    document.head.appendChild(s);
  });
}
async function _entregarImagen(blob, nombre){
  try{
    const file = new File([blob], (nombre||'imagen')+'.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: nombre||'Reporte'});
      toast('📤 Imagen compartida ✓');
      return;
    }
  }catch(err){ if(err && err.name==='AbortError') return; }
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      toast('📋 Imagen copiada — pégala donde quieras');
      return;
    }
  }catch(err){}
  _verImagenCompartir(blob);
}
function _verImagenCompartir(blob){
  const url = URL.createObjectURL(blob);
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:99998;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px';
  ov.innerHTML = '<div style="color:#fff;font-weight:700;font-size:14px;text-align:center">Mantén presionada la imagen para compartirla o guardarla</div>'
    + '<img src="'+url+'" style="max-width:100%;max-height:72vh;border-radius:10px;background:#fff">'
    + '<button style="padding:12px 26px;background:#eee;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px">Cerrar</button>';
  ov.querySelector('button').onclick = function(){ ov.remove(); URL.revokeObjectURL(url); };
  document.body.appendChild(ov);
}

// ── MÓDULOS (horómetros + cobros) ───────────────────────────────────────────
// ══ MÓDULOS MONHACO: TOMA DE HORÓMETROS + REPORTES DE COBRO ═══════════════
// Datos por registro en Firebase (sin riesgo de pisar otros nodos):
//   monhaco/horometros/<AAAA-MM>/<equipoId> = {lectura, ts, codigo}
//   monhaco/horometros/<AAAA-MM>/_cierre = {ts}  ← al finalizar la toma
//   monhaco/cobros/<id> = reporte RC-XXXX
// true define si esta app puede capturar lecturas (solo Logística).
// false en true: modo prueba — NUNCA escribe en las fichas reales.
const HOR_CAPTURA = true;
const HOR_PRUEBA = false;
const HOR_TIPOS = ['MONTACARGAS','STACKER','ELECTRO TOWER','MULAS','ELEVADORA'];
const _HC_MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let _horMesVista = null;

function _hcEsc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function horMesActual(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function horMesLabel(mes){ const p=(mes||'').split('-'); if(p.length<2) return mes||''; const n=_HC_MESES[parseInt(p[1],10)-1]||''; return n.charAt(0).toUpperCase()+n.slice(1)+' '+p[0]; }
function _horMeses(){
  const set = new Set(Object.keys(DB.horometros||{}));
  set.add(horMesActual());
  return Array.from(set).sort();
}
function _horEquipos(){
  return (DB.equipos||[]).filter(function(e){
    if(!e || e.esGenerico || e.esVehiculo || e.esEquipoCliente) return false;
    if(!HOR_TIPOS.includes(String(e.tipo||'').toUpperCase().trim())) return false;
    // Solo equipos operativos: en renta, disponibles o en mantenimiento (inactivos no)
    return ['DISPONIBLE','EN RENTA','EN MANTENIMIENTO'].includes(String(e.estado||'DISPONIBLE').toUpperCase().trim());
  }).sort(function(a,b){ return String(a.codigo||'').localeCompare(String(b.codigo||''), undefined, {numeric:true}); });
}
function _horLecturas(mes){ return ((DB.horometros||{})[mes])||{}; }
function _horCierre(mes){ return (((DB.horometros||{})[mes])||{})._cierre || null; }
function _horAnteriorReg(eq, mes){
  // Última lectura registrada en un mes ANTERIOR (con su fecha); si no hay, el horómetro de flota.
  const meses = Object.keys(DB.horometros||{}).filter(function(m){ return m < mes; }).sort().reverse();
  for(var i=0;i<meses.length;i++){
    const l = (DB.horometros[meses[i]]||{})[eq.id];
    if(l && l.lectura!=null && l.lectura!=='') return { lectura: parseFloat(l.lectura), ts: l.ts||null };
  }
  const h = parseFloat(eq.horometro);
  return isNaN(h) ? null : { lectura: h, ts: null };
}
function _horAnterior(eq, mes){ const r = _horAnteriorReg(eq, mes); return r ? r.lectura : null; }
function _horFechaTs(ts){
  if(!ts) return '—';
  const d = new Date(ts); if(isNaN(d)) return '—';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function _horTiene(l){ return !!(l && l.lectura!=null && l.lectura!==''); }
function _horEsManual(mes){ return !!((((DB.horometros||{})[mes])||{})._creada); }
function _horIrMes(mes){ _horMesVista = mes; renderHorometros(_HC_HOR_CONT); }
function _horMover(n){
  const meses = _horMeses();
  const i = meses.indexOf(_horMesVista||horMesActual()) + n;
  if(i<0 || i>=meses.length) return;
  _horMesVista = meses[i];
  renderHorometros(_HC_HOR_CONT);
}
function _horPlantas(equipos){
  const map = {};
  equipos.forEach(function(e){
    const p = String(e.ubicacion||'SIN PLANTA').toUpperCase().trim() || 'SIN PLANTA';
    (map[p] = map[p] || []).push(e);
  });
  return map;
}

// ── VISTA ÚNICA: tabla "CONTROL DE HOROMETRAJE" por planta; en Logística la
//    columna HOROMETRAJE FINAL es el campo de captura. ───────────────────────

  let filas = '';

    const l = lecturas[e.id];

    if(editable){
      celFinal = '<td style="'+td+';text-align:center;padding:3px 4px">'

        + 'onchange="horGuardar(\''+e.id+'\')" '

        + '<td style="'+td+';text-align:center;padding:3px 4px">'
        + '<button id="hor-del-'+e.id+'" onclick="horBorrar(\''+e.id+'\')" title="Borrar lectura" '
        + 'style="display:'+(tiene?'inline-block':'none')+';padding:7px 9px;border:1px solid #f5c6c6;background:#fdeaea;color:#c00;border-radius:6px;font-size:13px;cursor:pointer">🗑</button></td>';
    } else {
      celFinal = '<td style="'+td+';text-align:right;font-weight:800;color:'+(tiene?'#1a1a18':'#c00')+'">'+(tiene?parseFloat(l.lectura).toLocaleString('en-US'):'SIN TOMA')+'</td>';
    }
    filas += '<tr>'
      + '<td style="'+td+';font-weight:800;color:#1f3864">'+_hcEsc(e.codigo)+'</td>'
      + '<td style="'+td+'">'+_hcEsc(e.ubicacion||'—')+'</td>'
      + '<td style="'+td+';text-align:center">'+_hcEsc(e.capacidad||'—')+'</td>'

      + '<td id="hor-hasta-'+e.id+'" style="'+td+';text-align:center">'+((tiene&&cierre)?_horFechaTs(cierre.ts):'—')+'</td>'
      + '<td style="'+td+';text-align:right">'+(antR?antR.lectura.toLocaleString('en-US'):'—')+'</td>'
      + celFinal
      + '</tr>';
  });
  const colFinal = editable
    ? '<th rowspan="2" style="'+th+'">HOROMETRAJE<br>FINAL</th><th rowspan="2" style="'+th+'"></th>'
    : '<th rowspan="2" style="'+th+'">HOROMETRAJE<br>FINAL</th>';
  return '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:0 0 6px">'
    + '<div style="font-weight:800;color:#1f3864;font-size:13px;text-transform:uppercase;letter-spacing:0.3px">CONTROL DE HOROMETRAJE '+_hcEsc(planta)+'</div>'
    + '<div style="font-size:11px;color:#55534b;white-space:nowrap"><b>FECHA:</b> '+_horFechaTs(Date.now())+'</div></div>'
    + '<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;min-width:'+(editable?'720':'660')+'px;background:#fff">'
    + '<tr>'
    + '<th rowspan="2" style="'+th+'">EQUIPO</th>'
    + '<th rowspan="2" style="'+th+'">PLANTA</th>'
    + '<th rowspan="2" style="'+th+'">CAPACIDAD</th>'
    + '<th rowspan="2" style="'+th+'">MES</th>'
    + '<th colspan="2" style="'+th+'">FECHA</th>'
    + '<th rowspan="2" style="'+th+'">HOROMETRAJE<br>INICIO</th>'
    + colFinal
    + '</tr>'
    + '<tr><th style="'+th+'">DESDE</th><th style="'+th+'">HASTA</th></tr>'
    + filas
    + '</table></div>';
}
function _horReporteHTML(mes, editable, buscar){
  let equipos = _horEquipos();
  const lecturas = _horLecturas(mes);
  if(buscar) equipos = equipos.filter(function(e){
    return String(e.codigo||'').toLowerCase().includes(buscar) || String(e.ubicacion||'').toLowerCase().includes(buscar) || String(e.marca||'').toLowerCase().includes(buscar);
  });
  const plantas = _horPlantas(equipos);
  const nombres = Object.keys(plantas).sort();
  if(!nombres.length) return '<div style="text-align:center;color:var(--text3,#888);padding:20px 0;font-size:13px">Sin equipos para mostrar</div>';
  let h = '';
  nombres.forEach(function(p){
    h += '<div style="background:var(--surface,#fff);border:1px solid var(--border2,#e2e0d8);border-radius:10px;padding:12px;margin-bottom:12px">'
      + _horTablaPlantaHTML(p, plantas[p], mes, lecturas, editable)
      + '</div>';
  });
  return h;
}

  const buscar = (document.getElementById('hor-buscar') ? document.getElementById('hor-buscar').value : '').toLowerCase().trim();

    + '<div style="flex:1;text-align:center;font-weight:800;color:#1f3864;font-size:15px">\ud83d\udcdf '+_hcEsc(horMesLabel(mes))+'</div>'

    + '</div>';

    h += '<div style="background:#e6f6e6;border:1px solid #bbf7d0;color:#1a5c1a;border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-bottom:10px">\u2705 Toma finalizada el '+_horFechaTs(cierre.ts)+' \u2014 solo lectura. Los hor\u00f3metros quedaron en la ficha de cada equipo.</div>';

      + '<div style="background:#dcd9cf;border-radius:6px;height:10px;overflow:hidden"><div id="hor-prog-bar" style="background:'+(pct>=100?'#18A303':'#2d6a9f')+';height:100%;border-radius:6px;width:'+pct+'%"></div></div>'
      + '</div>';
    if(!HOR_CAPTURA) h += '<div style="font-size:12px;color:var(--text3,#888);margin-bottom:10px">\ud83d\udc41 Toma en curso \u2014 solo consulta. Las lecturas se capturan desde la app de Log\u00edstica MONHACO.</div>';
  }
  h += '<div style="display:flex;gap:8px;margin-bottom:12px">'
    + '<button onclick="compartirHorometros(\''+mes+'\',\'compartir\')" style="flex:1;padding:12px;background:#2d6a2d;color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:13.5px">\ud83d\udce4 Compartir Excel</button>'
    + '<button onclick="compartirHorometros(\''+mes+'\',\'descargar\')" style="flex:1;padding:12px;background:#1f3864;color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:13.5px">\ud83d\udce5 Descargar Excel</button>'
    + '</div>';
  h += '<input id="hor-buscar" placeholder="Buscar equipo o planta..." value="'+_hcEsc(buscar)+'" oninput="renderHorometros(\''+contId+'\')" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--border2,#ddd);border-radius:8px;font-size:14px;margin-bottom:10px">';

  h += _horReporteHTML(mes, editable, buscar);

  if(editable){

  }

    if(b){ b.focus(); try{ b.setSelectionRange(b.value.length, b.value.length); }catch(e){} }

// ── INICIO: solo el listado — tomas en curso + miniaturas de finalizadas ─────

        + '<div style="font-size:11px;color:var(--text3,#888);margin-top:2px">'+(HOR_CAPTURA?'Toca para continuar la toma':'Toca para consultar')+'</div>'

    });

// ── Guardado puntual: NO se re-dibuja la tabla (el re-dibujo perdía el foco y
//    no dejaba seguir digitando); solo se pinta la celda y el avance.
//    La ficha del equipo NO se toca aquí: se actualiza al FINALIZAR la toma. ──
function horGuardar(eqId){
  const inp = document.getElementById('hor-in-'+eqId); if(!inp) return;
  const val = inp.value.trim();
  const mes = _horMesVista || horMesActual();
  const eq = (DB.equipos||[]).find(function(e){ return e && e.id===eqId; }); if(!eq) return;
  if(_horCierre(mes)){ toast('Esta toma ya fue finalizada \u2014 solo lectura', true); return; }
  if(val===''){
    // Campo vaciado: si ya había lectura este mes, ofrecer borrarla
    if(_horTiene(_horLecturas(mes)[eqId])) horBorrar(eqId);
    return;
  }
  const lectura = parseFloat(val);
  if(isNaN(lectura) || lectura < 0){ toast('Lectura inválida', true); return; }
  const ant = _horAnterior(eq, mes);
  if(ant!=null && lectura < ant){
    if(!confirm('⚠️ La lectura ('+lectura.toLocaleString('en-US')+') es MENOR que la anterior ('+ant.toLocaleString('en-US')+' hrs).\n¿Guardarla de todas formas? (ej. cambio de reloj)')) { inp.value=''; return; }
  }
  const reg = { lectura: lectura, ts: Date.now(), codigo: eq.codigo||'' };
  if(!DB.horometros) DB.horometros = {};
  if(!DB.horometros[mes]) DB.horometros[mes] = {};
  DB.horometros[mes][eqId] = reg;
  try{
    if(window._fbDB) window._fbDB.ref('monhaco/horometros/'+mes+'/'+eqId).set(reg);
  }catch(e){}
  _horPintarFila(eqId);
  _horPintarAvance();
  toast(_hcEsc(eq.codigo)+': '+lectura.toLocaleString('en-US')+' hrs ✓ (pendiente de finalizar)');
}
function _horPintarFila(eqId){
  const l = _horLecturas(_horMesVista || horMesActual())[eqId];
  const tiene = _horTiene(l);
  const inp = document.getElementById('hor-in-'+eqId);
  const del = document.getElementById('hor-del-'+eqId);
  if(inp){ inp.style.borderColor = tiene ? '#18A303' : '#ccc'; }
  if(del){ del.style.display = tiene ? 'inline-block' : 'none'; }
}
function _horPintarAvance(){
  const mes = _horMesVista || horMesActual();
  const lecturas = _horLecturas(mes);
  const equipos = _horEquipos();
  const tomados = equipos.filter(function(e){ return _horTiene(lecturas[e.id]); }).length;
  const pct = equipos.length ? Math.round(tomados/equipos.length*100) : 0;
  const tx = document.getElementById('hor-prog-txt'); if(tx) tx.textContent = tomados+' / '+equipos.length+' equipos';
  const br = document.getElementById('hor-prog-bar'); if(br){ br.style.width = pct+'%'; br.style.background = pct>=100?'#18A303':'#2d6a9f'; }
}
// Borrar por completo la lectura del mes (para corregir, basta digitar el valor nuevo).
// No toca la ficha del equipo: la ficha solo cambia al finalizar la toma.
function horBorrar(eqId){
  const mes = _horMesVista || horMesActual();
  const eq = (DB.equipos||[]).find(function(e){ return e && e.id===eqId; }); if(!eq) return;
  if(_horCierre(mes)){ toast('Esta toma ya fue finalizada \u2014 solo lectura', true); return; }
  const l = _horLecturas(mes)[eqId];
  if(!_horTiene(l)){ return; }
  if(!confirm('🗑 ¿Borrar la lectura de '+(eq.codigo||'este equipo')+' ('+parseFloat(l.lectura).toLocaleString('en-US')+' hrs) de '+horMesLabel(mes)+'?')){
    const inp = document.getElementById('hor-in-'+eqId);
    if(inp) inp.value = l.lectura;
    _horPintarFila(eqId);
    return;
  }
  delete DB.horometros[mes][eqId];
  try{
    if(window._fbDB) window._fbDB.ref('monhaco/horometros/'+mes+'/'+eqId).remove();
  }catch(e){}
  const inp = document.getElementById('hor-in-'+eqId);
  if(inp) inp.value = '';
  _horPintarFila(eqId);
  _horPintarAvance();
  toast('Lectura de '+_hcEsc(eq.codigo)+' borrada ✓');
}

// ── FINALIZAR LA TOMA: fija la fecha HASTA y actualiza la ficha (horómetro)
//    de cada equipo con lectura. Es el ÚNICO punto que toca las fichas. ──────
function finalizarTomaHorometros(){
  const mes = _horMesVista || horMesActual();
  const lecturas = _horLecturas(mes);
  const equipos = _horEquipos();
  if(_horCierre(mes)){ toast('Esta toma ya fue finalizada', true); return; }
  const conLectura = equipos.filter(function(e){ return _horTiene(lecturas[e.id]); });
  if(!conLectura.length){ toast('No hay lecturas para finalizar', true); return; }
  const pend = equipos.length - conLectura.length;
  if(!confirm('¿Seguro que quieres finalizar la toma de '+horMesLabel(mes)+'?\n\nLos horómetros de '+conLectura.length+' equipos se actualizarán en la ficha de cada equipo.'+(pend?('\n\n(Ojo: quedan '+pend+' equipos sin toma)'):''))) return;
  const ts = Date.now();
  if(!DB.horometros[mes]) DB.horometros[mes] = {};
  DB.horometros[mes]._cierre = { ts: ts };
  try{
    if(window._fbDB) window._fbDB.ref('monhaco/horometros/'+mes+'/_cierre').set({ ts: ts });
  }catch(e){}
  // Fichas en memoria
  conLectura.forEach(function(e){ e.horometro = String(lecturas[e.id].lectura); });
  _horMesVista = null; // vuelve al listado: la toma queda como miniatura (solo lectura)
  if(HOR_PRUEBA){
    toast('✅ (PRUEBA) Toma finalizada — las fichas reales NO se tocaron');
    renderHorometros(_HC_HOR_CONT);
    return;
  }
  // Fichas en Firebase: una sola actualización con todas las rutas
  try{
    if(window._fbDB){
      window._fbDB.ref('monhaco/equipos').once('value').then(function(s){
        const v = s.val(); if(!v) return null;
        const updates = {};
        conLectura.forEach(function(e){
          let idx = -1;
          if(Array.isArray(v)){ idx = v.findIndex(function(x){ return x && x.id===e.id; }); }
          else { const ks=Object.keys(v); for(var i=0;i<ks.length;i++){ if(v[ks[i]] && v[ks[i]].id===e.id){ idx=ks[i]; break; } } }
          if(idx!==-1 && idx!==undefined) updates[idx+'/horometro'] = String(lecturas[e.id].lectura);
        });
        if(Object.keys(updates).length) return window._fbDB.ref('monhaco/equipos').update(updates);
        return null;
      }).then(function(){
        toast('✅ Toma finalizada — horómetros actualizados en '+conLectura.length+' fichas');
      }).catch(function(){
        toast('Cierre guardado, pero no se pudieron actualizar las fichas. Intenta finalizar de nuevo.', true);
      });
    }
  }catch(e){}
  renderHorometros(_HC_HOR_CONT);
}

// ── COMPARTIR / DESCARGAR COMO EXCEL (formato oficial: una hoja por planta) ──
function _cargarXLSXEstilos(){
  // xlsx-js-style: SheetJS con estilos (colores, bordes, celdas combinadas).
  // Se guarda en _XLSXS para no pisar el XLSX simple que ya usan otras partes.
  if(window._XLSXS) return Promise.resolve();
  return new Promise(function(res, rej){
    var prev = window.XLSX;
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js';
    s.onload = function(){ window._XLSXS = window.XLSX; if(prev) window.XLSX = prev; res(); };
    s.onerror = function(){ rej(new Error('sin conexión para cargar el generador de Excel')); };
    document.head.appendChild(s);
  });
}
function _horNombreHoja(planta){
  var n = String(planta||'PLANTA').replace(/[\\\/\?\*\[\]:]/g, ' ').trim();
  return n.slice(0, 31) || 'PLANTA';
}
function _horLibroXLSX(mes){
  const X = window._XLSXS;
  const equipos = _horEquipos();
  const lecturas = _horLecturas(mes);
  const cierre = _horCierre(mes);
  const plantas = _horPlantas(equipos);
  const nombres = Object.keys(plantas).sort();
  const hoy = new Date();
  const fechaTxt = (_HC_MESES[hoy.getMonth()].charAt(0).toUpperCase()+_HC_MESES[hoy.getMonth()].slice(1))+' '+hoy.getDate()+'-'+hoy.getFullYear();
  const AZUL = '1F3864', RELLENO = 'DCE6F1';
  const bordeFino = { style:'thin', color:{rgb:'000000'} };
  const BORDES = { top:bordeFino, bottom:bordeFino, left:bordeFino, right:bordeFino };
  const S_TITULO = { font:{bold:true, sz:12, color:{rgb:AZUL}}, alignment:{horizontal:'center', vertical:'center'} };
  const S_HDR = { font:{bold:true, sz:9, color:{rgb:AZUL}}, fill:{patternType:'solid', fgColor:{rgb:RELLENO}}, alignment:{horizontal:'center', vertical:'center', wrapText:true}, border:BORDES };
  const S_TXT = { font:{sz:10}, alignment:{horizontal:'left', vertical:'center'}, border:BORDES };
  const S_CEN = { font:{sz:10}, alignment:{horizontal:'center', vertical:'center'}, border:BORDES };
  const S_NUM = { font:{sz:10}, alignment:{horizontal:'right', vertical:'center'}, border:BORDES, numFmt:'#,##0' };
  const S_SIN = { font:{sz:9, bold:true, color:{rgb:'C00000'}}, alignment:{horizontal:'center', vertical:'center'}, border:BORDES };
  const S_EQ  = { font:{sz:10, bold:true, color:{rgb:AZUL}}, alignment:{horizontal:'left', vertical:'center'}, border:BORDES };

  const wb = X.utils.book_new();
  nombres.forEach(function(planta){
    const grupo = plantas[planta];
    const filas = [];
    filas.push([]); // fila 1
    filas.push(['','','','','','',{ v:'FECHA', s:{font:{bold:true, sz:10}} }, { v:fechaTxt, s:{font:{sz:10}} }]); // fila 2
    filas.push([]); // fila 3
    filas.push([{ v:'CONTROL DE HOROMETRAJE '+planta, s:S_TITULO }]); // fila 4
    filas.push([{v:'EQUIPO',s:S_HDR},{v:'PLANTA',s:S_HDR},{v:'CAPACIDAD',s:S_HDR},{v:'MES',s:S_HDR},{v:'FECHA',s:S_HDR},{v:'',s:S_HDR},{v:'HOROMETRAJE INICIO',s:S_HDR},{v:'HOROMETRAJE FINAL',s:S_HDR}]); // fila 5
    filas.push([{v:'',s:S_HDR},{v:'',s:S_HDR},{v:'',s:S_HDR},{v:'',s:S_HDR},{v:'DESDE',s:S_HDR},{v:'HASTA',s:S_HDR},{v:'',s:S_HDR},{v:'',s:S_HDR}]); // fila 6
    grupo.forEach(function(e){
      const l = lecturas[e.id];
      const tiene = _horTiene(l);
      const antR = _horAnteriorReg(e, mes);
      filas.push([
        { v: e.codigo||'', s: S_EQ },
        { v: e.ubicacion||'', s: S_TXT },
        { v: e.capacidad||'', s: S_CEN },
        { v: horMesLabel(mes), s: S_CEN },
        { v: (antR&&antR.ts)?_horFechaTs(antR.ts):'', s: S_CEN },
        { v: (tiene&&cierre)?_horFechaTs(cierre.ts):'', s: S_CEN },
        (antR ? { v: antR.lectura, t:'n', s: S_NUM } : { v:'', s: S_CEN }),
        (tiene ? { v: parseFloat(l.lectura), t:'n', s: S_NUM } : { v:'SIN TOMA', s: S_SIN }),
      ]);
    });
    filas.push([]);
    filas.push([{ v:'Nota:', s:{font:{bold:true, sz:10}} }]);
    filas.push([{ v:'Los montacargas incluyen los siguientes accesorios:', s:{font:{sz:10}} }]);
    filas.push([{ v:'*Extintor', s:{font:{sz:10}} }]);
    filas.push([{ v:'*Capota', s:{font:{sz:10}} }]);
    filas.push([{ v:'*Retrovisores', s:{font:{sz:10}} }]);

    const ws = X.utils.aoa_to_sheet(filas);
    // Combinaciones como en el formato: título + encabezado de dos filas
    ws['!merges'] = [
      { s:{r:3,c:0}, e:{r:3,c:7} },  // título A4:H4
      { s:{r:4,c:0}, e:{r:5,c:0} },  // EQUIPO
      { s:{r:4,c:1}, e:{r:5,c:1} },  // PLANTA
      { s:{r:4,c:2}, e:{r:5,c:2} },  // CAPACIDAD
      { s:{r:4,c:3}, e:{r:5,c:3} },  // MES
      { s:{r:4,c:4}, e:{r:4,c:5} },  // FECHA (desde/hasta)
      { s:{r:4,c:6}, e:{r:5,c:6} },  // HOROMETRAJE INICIO
      { s:{r:4,c:7}, e:{r:5,c:7} },  // HOROMETRAJE FINAL
    ];
    ws['!cols'] = [{wch:11},{wch:22},{wch:13},{wch:16},{wch:12},{wch:12},{wch:15},{wch:15}];
    ws['!rows'] = [null,null,null,{hpt:22},{hpt:24},{hpt:16}];
    X.utils.book_append_sheet(wb, ws, _horNombreHoja(planta));
  });
  return wb;
}
async function _horEntregarXLSX(wb, nombre, modo){
  const X = window._XLSXS;
  const out = X.write(wb, { bookType:'xlsx', type:'array' });
  const MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const blob = new Blob([out], { type: MIME });
  if(modo !== 'descargar'){
    try{
      const file = new File([blob], nombre+'.xlsx', { type: MIME });
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: nombre});
        toast('📤 Excel compartido ✓');
        return;
      }
    }catch(err){ if(err && err.name==='AbortError') return; }
  }
  // Descarga directa al dispositivo (o respaldo si no se puede compartir)
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre+'.xlsx'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  toast('📥 Excel descargado en el dispositivo');
}
async function compartirHorometros(mes, modo){
  try{
    toast('Generando Excel…');
    await _cargarXLSXEstilos();
    const wb = _horLibroXLSX(mes);
    if(!wb.SheetNames.length){ toast('Sin equipos para el reporte', true); return; }
    window._horWB = wb;
    await _horEntregarXLSX(wb, 'Control_Horometraje_'+horMesLabel(mes).replace(/ /g,'_')+(HOR_PRUEBA?'_PRUEBA':''), modo||'compartir');
  }catch(err){ toast('Error al generar el Excel: '+err.message, true); }
}

    });

  }
  if(_rcFotosTmp.length < 10){
    const inp = function(cam){ return '<input type="file" accept="image/*"'+(cam?' capture="environment"':'')+' multiple style="display:none" onchange="event.stopPropagation();rcFormFotosAgregar(this)">'; };
    h += '<div style="display:flex;gap:8px">'
      + '<label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:10px;border:1.5px dashed var(--border2,#ccc);border-radius:8px;font-size:13px;color:#1f3864">'+inp(true)+'📷 Cámara'+(_rcFotosTmp.length>0?' ('+_rcFotosTmp.length+'/10)':'')+'</label>'
      + '<label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:10px;border:1.5px dashed var(--border2,#ccc);border-radius:8px;font-size:13px;color:#1f3864">'+inp(false)+'🖼️ Galería</label>'
      + '</div>';
  } else {
    h += '<div style="font-size:12px;color:var(--text3,#888);padding:6px 0">Límite de 10 fotos alcanzado</div>';
  }
  cont.innerHTML = h;
}
function rcFormFotosAgregar(input){
  const archivos = Array.from(input.files);
  const espacio = 10 - _rcFotosTmp.length;
  input.value = '';
  if(espacio<=0){ toast('Límite de 10 fotos alcanzado', true); return; }
  const procesar = archivos.slice(0, espacio);
  if(archivos.length>espacio) toast('Solo se agregaron '+espacio+' de '+archivos.length+' (límite 10)', true);
  let pend = procesar.length, agregadas = 0;
  const done = function(){ pend--; if(pend<=0){ _rcFormFotosUI(); if(agregadas>0) toast(agregadas+' foto'+(agregadas>1?'s':'')+' agregada'+(agregadas>1?'s':'')+' ✓'); } };
  procesar.forEach(function(file){
    const reader = new FileReader();
    reader.onerror = done;
    reader.onload = function(ev){
      const img = new Image();
      img.onerror = done;
      img.onload = function(){
        try{
          const canvas = document.createElement('canvas');
          const MAX = 1024;
          let w = img.width, h = img.height;
          if(w > MAX){ h = Math.round(h*MAX/w); w = MAX; }
          if(h > MAX){ w = Math.round(w*MAX/h); h = MAX; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          _rcFotosTmp.push(canvas.toDataURL('image/jpeg', 0.7));
          agregadas++;
        }catch(err){}
        done();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function rcFormFotosEliminar(i){
  if(!confirm('¿Eliminar esta foto?')) return;
  _rcFotosTmp.splice(i, 1);
  _rcFormFotosUI();
}

function rcFirmaAbrir(){
  const viejo = document.getElementById('rc-firma-overlay'); if(viejo) viejo.remove();
  const esPC = !('ontouchstart' in window) && window.innerWidth > 900;
  const portrait = window.innerHeight > window.innerWidth && !esPC;
  const ov = document.createElement('div');
  ov.id = 'rc-firma-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:#20242c;z-index:99997;overflow:hidden';
  // Dimensiones visibles del área de firma (apaisada)
  const visW = (portrait ? window.innerHeight : window.innerWidth) - (esPC ? 0 : 24);
  const visH = (portrait ? window.innerWidth : window.innerHeight) - (esPC ? 0 : 24);
  const anchoLienzo = esPC ? Math.min(700, window.innerWidth-80) : visW - 16;
  const altoLienzo = esPC ? 240 : Math.max(140, visH - 128);
  const inner = '<div style="color:#fff;font-weight:700;font-size:14px;text-align:center;padding:10px 8px 6px">✍️ Firme dentro del recuadro</div>'
    + '<canvas id="rc-firma-canvas" width="'+(anchoLienzo*2)+'" height="'+(altoLienzo*2)+'" style="display:block;margin:0 auto;background:#fff;border-radius:12px;width:'+anchoLienzo+'px;height:'+altoLienzo+'px;touch-action:none"></canvas>'
    + '<div style="display:flex;gap:8px;justify-content:center;padding:10px 8px">'
    + '<button onclick="rcFirmaGuardarOverlay()" style="padding:12px 22px;background:#27ae60;color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:14px">💾 Guardar firma</button>'
    + '<button onclick="_rcFirmaLimpiarLienzo()" style="padding:12px 16px;background:#3a3f49;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px">🗑 Borrar</button>'
    + '<button onclick="document.getElementById(\'rc-firma-overlay\').remove()" style="padding:12px 16px;background:#3a3f49;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px">Cancelar</button>'
    + '</div>';
  if(portrait){
    // Girar el área completa a horizontal (como en las apps de técnicos)
    ov.innerHTML = '<div id="rc-firma-wrap" style="position:absolute;left:50%;top:50%;width:'+window.innerHeight+'px;height:'+window.innerWidth+'px;transform:translate(-50%,-50%) rotate(90deg)">'+inner+'</div>';
  } else {
    ov.innerHTML = '<div id="rc-firma-wrap" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:'+(esPC?Math.min(760,window.innerWidth-40):window.innerWidth)+'px">'+inner+'</div>';
  }
  document.body.appendChild(ov);
  const c = document.getElementById('rc-firma-canvas');
  const ctx = c.getContext('2d');
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a2a4a';
  window._rcFirmaHayTrazo = false;
  let dibujando = false;
  const punto = function(ev){
    const t = (ev.touches && ev.touches[0]) || ev;
    const r = c.getBoundingClientRect();
    if(portrait){
      // El lienzo está girado 90°: mapear el puntero al sistema del lienzo
      return { x: (t.clientY - r.top) * c.width / r.height, y: (r.right - t.clientX) * c.height / r.width };
    }
    return { x: (t.clientX - r.left) * c.width / r.width, y: (t.clientY - r.top) * c.height / r.height };
  };
  const abajo = function(ev){ ev.preventDefault(); dibujando = true; const p = punto(ev); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const mover = function(ev){ if(!dibujando) return; ev.preventDefault(); const p = punto(ev); ctx.lineTo(p.x, p.y); ctx.stroke(); window._rcFirmaHayTrazo = true; };
  const arriba = function(){ dibujando = false; };
  c.addEventListener('touchstart', abajo, {passive:false});
  c.addEventListener('touchmove', mover, {passive:false});
  c.addEventListener('touchend', arriba);
  c.addEventListener('mousedown', abajo);
  c.addEventListener('mousemove', mover);
  c.addEventListener('mouseup', arriba);
  c.addEventListener('mouseleave', arriba);
}

window._rcFotoCache = window._rcFotoCache || {};
window._rcFotoCargando = window._rcFotoCargando || {};
function _rcLista(){

function _rcSigCorrelativo(){
  let max = 0;
  _rcLista().forEach(function(r){ const m=/(\d+)\s*$/.exec(String(r.correlativo||'')); if(m){ const v=parseInt(m[1],10); if(v>max) max=v; } });
  return 'RC-'+String(max+1).padStart(4,'0');

function _rcPersistir(r){
  // Guardar el reporte SIN las fotos (van en su propio nodo)
  const copia = {}; for(const k in r){ if(k==='fotos') continue; copia[k]=r[k]; }
  try{ if(window._fbDB) window._fbDB.ref('monhaco/cobros/'+r.id).set(copia); }catch(e){}

function _rcFotosPend(r){
  return !!(r && r.id && (r.nFotos>0) && !(Array.isArray(r.fotos) && r.fotos.length));
}
function _rcHidratar(r, cb){
  if(!r || !r.id) return;
  const c = window._rcFotoCache[r.id];
  if(c && c.length){ r.fotos = c; if(cb) cb(); return; }
  if(!window._fbDB || window._rcFotoCargando[r.id]) return;
  window._rcFotoCargando[r.id] = true;
  window._fbDB.ref('fotosOrden_monhaco/'+r.id).once('value').then(function(s){
    delete window._rcFotoCargando[r.id];
    const v = s.val();
    const arr = (v && Array.isArray(v.fotos)) ? v.fotos.filter(Boolean) : (Array.isArray(v) ? v.filter(Boolean) : []);
    window._rcFotoCache[r.id] = arr;

  }).catch(function(){ delete window._rcFotoCargando[r.id]; });
}
function _rcPersistirFotos(r){
  if(!r || !r.id || !window._fbDB) return;
  const fotos = (r.fotos||[]).filter(Boolean);
  window._fbDB.ref('fotosOrden_monhaco/'+r.id).set({fotos:fotos}).then(function(){
    r.nFotos = fotos.length;

  });

function rcFotosAgregar(id, input){
  const r = _rcLista().find(function(x){ return x.id===id; }); if(!r) return;
  if(!r.fotos) r.fotos = [];
  const archivos = Array.from(input.files);
  const espacio = 10 - r.fotos.length;
  input.value = '';
  if(espacio<=0){ toast('Límite de 10 fotos alcanzado', true); return; }
  const procesar = archivos.slice(0, espacio);
  if(archivos.length>espacio) toast('Solo se agregaron '+espacio+' de '+archivos.length+' (límite 10)', true);
  let pend = procesar.length, agregadas = 0;
  const fin = function(){
    _rcPersistirFotos(r);
    rcVer(id);
    if(agregadas>0) toast(agregadas+' foto'+(agregadas>1?'s':'')+' agregada'+(agregadas>1?'s':'')+' ✓');
    else toast('No se pudo procesar ninguna foto', true);
  };
  const done = function(){ pend--; if(pend<=0) fin(); };
  procesar.forEach(function(file){
    const reader = new FileReader();
    reader.onerror = done;
    reader.onload = function(ev){
      const img = new Image();
      img.onerror = done;
      img.onload = function(){
        try{
          const canvas = document.createElement('canvas');
          const MAX = 1024;
          let w = img.width, h = img.height;
          if(w > MAX){ h = Math.round(h*MAX/w); w = MAX; }
          if(h > MAX){ w = Math.round(w*MAX/h); h = MAX; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          r.fotos.push(canvas.toDataURL('image/jpeg', 0.7));
          agregadas++;
        }catch(err){}
        done();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function _cargarJsPDF(){
  if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
  return new Promise(function(res, rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=res; s.onerror=function(){ rej(new Error('sin conexión para cargar el generador de PDF')); };
    document.head.appendChild(s);
  });

async function rcCompartirPDF(id){
  try{
    const r = _rcLista().find(function(x){ return x.id===id; }); if(!r) return;
    if(_rcFotosPend(r)){ toast('Cargando fotografías…'); _rcHidratar(r, function(){ rcCompartirPDF(id); }); return; }
    toast('Generando PDF…');
    await _cargarJsPDF();
    // 1) Datos del reporte (sin fotos) — se pagina por tramos
    const canvas = await _rcCanvas(r, true);
    const jsPDF = window.jspdf.jsPDF;
    const pdf = new jsPDF({unit:'mm', format:'letter'});
    const margen = 12;
    const anchoMM = pdf.internal.pageSize.getWidth() - margen*2;
    const altoPag = pdf.internal.pageSize.getHeight();
    const pxPorMM = canvas.width / anchoMM;
    const altoPagPx = Math.floor((altoPag - margen*2) * pxPorMM);
    let y = 0, pagina = 0, yMM = margen;
    while(y < canvas.height){
      const tramo = Math.min(altoPagPx, canvas.height - y);
      const c2 = document.createElement('canvas');
      c2.width = canvas.width; c2.height = tramo;
      c2.getContext('2d').drawImage(canvas, 0, y, canvas.width, tramo, 0, 0, canvas.width, tramo);
      if(pagina > 0){ pdf.addPage(); yMM = margen; }
      const tramoMM = tramo / pxPorMM;
      pdf.addImage(c2.toDataURL('image/jpeg', 0.92), 'JPEG', margen, margen, anchoMM, tramoMM);
      yMM = margen + tramoMM;
      y += tramo; pagina++;
    }
    // 2) Fotografías: cada una completa, saltando de página cuando no cabe
    const fotos = (r.fotos||[]).filter(Boolean);
    if(fotos.length){
      const dims = await Promise.all(fotos.map(function(f){
        return new Promise(function(res){
          const im = new Image();
          im.onload = function(){ res({w: im.naturalWidth||4, h: im.naturalHeight||3}); };
          im.onerror = function(){ res({w: 4, h: 3}); };
          im.src = f;
        });
      }));
      const gap = 4;
      const cellW = (anchoMM - gap) / 2;
      const maxCellH = 85;
      yMM += 6;
      if(yMM + 10 > altoPag - margen){ pdf.addPage(); yMM = margen; }
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(11);
      pdf.setTextColor(138, 72, 0);
      pdf.text('FOTOGRAFIAS DEL DANO ('+fotos.length+')', margen, yMM + 4);
      yMM += 8;
      for(let i = 0; i < fotos.length; i += 2){
        const h1 = Math.min(cellW * dims[i].h / dims[i].w, maxCellH);
        const h2 = (i+1 < fotos.length) ? Math.min(cellW * dims[i+1].h / dims[i+1].w, maxCellH) : 0;
        const filaH = Math.max(h1, h2);
        if(yMM + filaH > altoPag - margen){ pdf.addPage(); yMM = margen; }
        try{ pdf.addImage(fotos[i], 'JPEG', margen, yMM, cellW, h1); }catch(e){}
        if(i+1 < fotos.length){ try{ pdf.addImage(fotos[i+1], 'JPEG', margen + cellW + gap, yMM, cellW, h2); }catch(e){} }
        yMM += filaH + gap;
      }
    }
    const nombre = String(r.correlativo||'Reporte_cobro').replace(/[^\w\-]+/g,'_');
    const blob = pdf.output('blob');
    // 1) Hoja de compartir del teléfono (WhatsApp, correo...) — sin descargar
    try{
      const file = new File([blob], nombre+'.pdf', {type:'application/pdf'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: nombre});
        toast('📄 PDF compartido ✓');
        return;
      }
    }catch(err){ if(err && err.name==='AbortError') return; }
    // 2) PC / navegadores sin hoja de compartir: abrirlo en una pestaña
    const url = URL.createObjectURL(blob);
    const w = window.open(url, '_blank');
    if(w){ toast('📄 PDF abierto en otra pestaña'); }
    else {
      const a = document.createElement('a');
      a.href = url; a.download = nombre+'.pdf'; a.click();
      toast('📄 PDF generado');
    }
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }catch(err){ toast('Error al generar el PDF: '+err.message, true); }
}

function _rmArr(k){ return k==='prev'?(DB.preventivos||[]):k==='corr'?(DB.correctivos||[]):(DB.cortinas||[]); }
function _rmOrdenes(cliente, mes){
  cliente = String(cliente||'').trim().toUpperCase();
  const out = {};
  _RM_TIPOS.forEach(function(tp){
    out[tp.k] = _rmArr(tp.k).filter(Boolean).filter(function(o){
      return _rmCliDe(o)===cliente && _rmMesDe(o)===mes;
    }).sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||'')); });
  });
  out.total = out.prev.length + out.corr.length + out.cort.length;
  const todas = [].concat(out.prev, out.corr, out.cort);
  out.completadas = todas.filter(function(o){ return o.completado || o.estado==='Completado'; }).length;
  out.pendientes = out.total - out.completadas;
  const eqs = new Set();
  todas.forEach(function(o){
    if(o.equipoId && o.equipoId!=='__cliente__') eqs.add(o.equipoId);
    else if(o.ubicacion) eqs.add('u:'+o.ubicacion);
  });
  out.equipos = eqs.size;
  return out;
}
function _rmClientes(){
  const set = new Set(CLIENTES_MONHACO);
  [].concat(DB.preventivos||[], DB.correctivos||[], DB.cortinas||[])
    .filter(Boolean).forEach(function(o){ const c=_rmCliDe(o); if(c) set.add(c); });
  return Array.from(set);
}
function _rmEquipoTxt(o){
  if(o.equipoId){
    const eq = (DB.equipos||[]).find(function(e){ return e && e.id===o.equipoId; });
    if(eq) return eq.codigo+(eq.marca?' — '+eq.marca:'');
  }
  return o.clienteNombre || o.ubicacion || '—';
}
function _rmDescDe(k, o){
  if(k==='prev') return o.servicio || o.notas || '';
  if(k==='corr') return o.falla || o.diagnostico || '';
  return o.descripcion || '';
}

  const viejo = document.getElementById('rm-overlay'); if(viejo) viejo.remove();
  const ov = document.createElement('div');
  ov.id = 'rm-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:var(--bg,#f4f3ee);z-index:700;overflow:auto';
  ov.innerHTML = '<div style="background:linear-gradient(135deg,#173a5c,#1f5488);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center">'
    + '<div style="font-weight:800;font-size:16px">📊 Reporte mensual por cliente</div>'
    + '<button onclick="document.getElementById(\'rm-overlay\').remove()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer">✕</button></div>'
    + '<div style="max-width:680px;margin:0 auto;padding:14px" id="rm-cont"></div>';
  document.body.appendChild(ov);
  if(!_rmMes) _rmMes = horMesActual();
  renderReporteMensual();
}
function _rmMoverMes(n){
  const p = (_rmMes||horMesActual()).split('-');
  const d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1+n, 1);
  _rmMes = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  renderReporteMensual();
}
function _rmCardHTML(tp, o, paraImagen){
  const est = o.estado || (o.completado?'Completado':'Pendiente');
  const comp = o.completado || est==='Completado';
  const desc = _rmDescDe(tp.k, o);
  const tecs = o.tecnico || (o.tecnicos && o.tecnicos.filter(Boolean).join(', ')) || '';
  return '<div style="background:#fff;border:1px solid #e2e0d8;border-left:3px solid '+tp.color+';border-radius:10px;padding:9px 12px;margin-bottom:6px">'
    + '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px">'
    + '<span style="font-size:11px;font-weight:700;font-family:monospace;background:#eef2f8;color:#1f3864;padding:2px 8px;border-radius:10px">'+_hcEsc(o.correlativo||'—')+'</span>'
    + '<span style="font-size:11px;font-weight:700;background:'+(comp?'#e5f7e0':'#fff8e1')+';color:'+(comp?'#1a5c1a':'#b45309')+';padding:2px 8px;border-radius:10px">'+_hcEsc(est)+'</span>'
    + '<span style="font-size:11px;color:#9c9a90">📅 '+_hcEsc(o.fecha||'—')+'</span>'
    + '</div>'
    + '<div style="font-size:13px;font-weight:700;color:#1a1a18">'+_hcEsc(_rmEquipoTxt(o))+'</div>'
    + (desc?'<div style="font-size:12px;color:#55534b;margin-top:2px">'+_hcEsc(String(desc).slice(0,160))+'</div>':'')
    + (tecs?'<div style="font-size:11px;color:#9c9a90;margin-top:3px">👷 '+_hcEsc(tecs)+'</div>':'')
    + '</div>';
}
function _rmSeccionTituloHTML(tp, n){
  return '<div style="display:flex;align-items:center;gap:8px;background:'+tp.color+'12;border-left:4px solid '+tp.color+';border-radius:8px;padding:8px 12px;margin:14px 0 8px">'
    + '<span style="font-size:15px">'+tp.emoji+'</span>'
    + '<span style="font-weight:800;color:'+tp.color+';font-size:13px;text-transform:uppercase;letter-spacing:0.5px">'+tp.t+'</span>'
    + '<span style="margin-left:auto;background:'+tp.color+';color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:2px 9px">'+n+'</span>'

}
function _rmResumenHTML(datos, mes){
  return '<div style="background:linear-gradient(135deg,#173a5c,#1f5488);border-radius:12px;padding:14px 16px;color:#fff;margin-bottom:10px">'
    + '<div style="font-size:16px;font-weight:800">'+_hcEsc(_rmCliente)+'</div>'
    + '<div style="font-size:12px;color:#a9c8de;margin-top:1px">'+_hcEsc(horMesLabel(mes))+' — del 1 al último día del mes</div>'
    + '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'
    + '<div style="flex:1;min-width:70px;background:rgba(255,255,255,0.12);border-radius:8px;padding:8px;text-align:center"><div style="font-size:20px;font-weight:800">'+datos.total+'</div><div style="font-size:10px;color:#a9c8de;font-weight:700">ÓRDENES</div></div>'
    + '<div style="flex:1;min-width:70px;background:rgba(255,255,255,0.12);border-radius:8px;padding:8px;text-align:center"><div style="font-size:20px;font-weight:800;color:#7ee787">'+datos.completadas+'</div><div style="font-size:10px;color:#a9c8de;font-weight:700">COMPLETADAS</div></div>'
    + '<div style="flex:1;min-width:70px;background:rgba(255,255,255,0.12);border-radius:8px;padding:8px;text-align:center"><div style="font-size:20px;font-weight:800;color:#ffd479">'+datos.pendientes+'</div><div style="font-size:10px;color:#a9c8de;font-weight:700">EN PROCESO</div></div>'
    + '<div style="flex:1;min-width:70px;background:rgba(255,255,255,0.12);border-radius:8px;padding:8px;text-align:center"><div style="font-size:20px;font-weight:800">'+datos.equipos+'</div><div style="font-size:10px;color:#a9c8de;font-weight:700">EQUIPOS</div></div>'
    + '</div>'
    + '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">'
    + _RM_TIPOS.map(function(tp){ return '<span style="font-size:11px;font-weight:700;background:rgba(255,255,255,0.16);border-radius:10px;padding:3px 10px">'+tp.emoji+' '+datos[tp.k].length+' '+tp.t.toLowerCase()+'</span>'; }).join('')
    + '</div></div>';
}
function renderReporteMensual(){
  const cont = document.getElementById('rm-cont'); if(!cont) return;
  const mes = _rmMes||horMesActual();
  let h = '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">'
    + '<button onclick="_rmMoverMes(-1)" style="padding:9px 14px;border:1px solid var(--border2,#ddd);border-radius:8px;background:#fff;cursor:pointer;font-weight:800;font-size:15px">‹</button>'
    + '<div style="flex:1;text-align:center;font-weight:800;color:#1f3864;font-size:15px">'+_hcEsc(horMesLabel(mes))+'</div>'
    + '<button onclick="_rmMoverMes(1)" style="padding:9px 14px;border:1px solid var(--border2,#ddd);border-radius:8px;background:#fff;cursor:pointer;font-weight:800;font-size:15px">›</button>'
    + '</div>';
  h += '<select id="rm-cliente" onchange="_rmCliente=this.value;renderReporteMensual()" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--border2,#ccc);border-radius:8px;font-size:14px;background:#fff;margin-bottom:12px;font-weight:700">'
    + '<option value="">— Seleccionar cliente —</option>'
    + _rmClientes().map(function(c){ return '<option value="'+_hcEsc(c)+'"'+(c===_rmCliente?' selected':'')+'>'+_hcEsc(c)+'</option>'; }).join('')
    + '</select>';
  if(!_rmCliente){
    h += '<div style="color:var(--text3,#888);font-size:13px;text-align:center;padding:20px 0">Elige un cliente para ver sus órdenes de trabajo del mes.</div>';
    cont.innerHTML = h; return;
  }
  const datos = _rmOrdenes(_rmCliente, mes);
  h += _rmResumenHTML(datos, mes);
  if(datos.total){
    h += '<div style="display:flex;gap:8px;margin-bottom:4px">'
      + '<button onclick="rmCompartirPDF()" style="flex:1;padding:12px;background:#8a1f1f;color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:13px">📄 Compartir PDF</button>'
      + '<button onclick="rmCompartirImagen()" style="flex:1;padding:12px;background:#2d6a2d;color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:13px">📤 Compartir imagen</button>'
      + '</div>';
    _RM_TIPOS.forEach(function(tp){
      const lista = datos[tp.k];
      if(!lista.length) return;
      h += _rmSeccionTituloHTML(tp, lista.length);
      lista.forEach(function(o){ h += _rmCardHTML(tp, o); });
    });
  } else {
    h += '<div style="color:var(--text3,#888);font-size:13px;text-align:center;padding:16px 0">Sin órdenes de trabajo de '+_hcEsc(_rmCliente)+' en este mes.</div>';
  }
  cont.innerHTML = h;
}
// ── Compartir: imagen y PDF (cada tarjeta completa, sin cortes) ──────────────
function _rmDOMBase(html, conMargen){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:-9999px;top:0;width:460px;background:#fff;font-family:DM Sans,Arial,sans-serif;padding:'+(conMargen||'3px 14px')+';box-sizing:border-box;';
  d.innerHTML = html;
  return d;
}
function _rmHeaderHTML(datos, mes){
  const logo = (typeof _LOGO_MONTASA_B64!=='undefined') ? _LOGO_MONTASA_B64 : '';
  return '<div style="background:linear-gradient(135deg,#173a5c,#1f5488);padding:16px 18px 13px;color:#fff;border-radius:12px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;gap:14px">'
    + '<div style="min-width:0"><div style="font-size:18px;font-weight:700">Reporte mensual — '+_hcEsc(_rmCliente)+'</div>'
    + '<div style="font-size:13px;color:#a9c8de;margin-top:2px">'+_hcEsc(horMesLabel(mes))+' · MONHACO</div></div>'
    + (logo?'<div style="flex-shrink:0"><img src="'+logo+'" style="height:44px;display:block"></div>':'')
    + '</div>'
    + '<div style="display:flex;gap:8px;margin-top:12px">'
    + '<div style="flex:1;background:rgba(255,255,255,0.12);border-radius:8px;padding:7px;text-align:center"><div style="font-size:18px;font-weight:800">'+datos.total+'</div><div style="font-size:9.5px;color:#a9c8de;font-weight:700">ÓRDENES</div></div>'
    + '<div style="flex:1;background:rgba(255,255,255,0.12);border-radius:8px;padding:7px;text-align:center"><div style="font-size:18px;font-weight:800;color:#7ee787">'+datos.completadas+'</div><div style="font-size:9.5px;color:#a9c8de;font-weight:700">COMPLETADAS</div></div>'
    + '<div style="flex:1;background:rgba(255,255,255,0.12);border-radius:8px;padding:7px;text-align:center"><div style="font-size:18px;font-weight:800;color:#ffd479">'+datos.pendientes+'</div><div style="font-size:9.5px;color:#a9c8de;font-weight:700">EN PROCESO</div></div>'
    + '<div style="flex:1;background:rgba(255,255,255,0.12);border-radius:8px;padding:7px;text-align:center"><div style="font-size:18px;font-weight:800">'+datos.equipos+'</div><div style="font-size:9.5px;color:#a9c8de;font-weight:700">EQUIPOS</div></div>'
    + '</div></div>';
}
function _rmPieHTML(){
  return '<div style="padding:10px 2px 2px;text-align:center;color:#9c9a90;font-size:10.5px">Documento generado desde el sistema interno de Montasa Handling Co. — '+new Date().toLocaleDateString('es-HN')+'</div>';
}
async function _rmCanvasDe(el){
  document.body.appendChild(el);
  const imgs = el.querySelectorAll('img');
  await Promise.all(Array.from(imgs).map(function(img){
    if(img.complete && img.naturalWidth>0) return Promise.resolve();
    return new Promise(function(r){ img.onload=r; img.onerror=r; setTimeout(r,3000); });
  }));
  const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff'});
  document.body.removeChild(el);
  return canvas;
}
async function rmCompartirImagen(){
  try{
    const mes = _rmMes||horMesActual();
    const datos = _rmOrdenes(_rmCliente, mes);
    if(!datos.total) return;
    toast('Generando imagen…');
    await _cargarHtml2Canvas();
    let html = _rmHeaderHTML(datos, mes);
    _RM_TIPOS.forEach(function(tp){
      if(!datos[tp.k].length) return;
      html += _rmSeccionTituloHTML(tp, datos[tp.k].length);
      datos[tp.k].forEach(function(o){ html += _rmCardHTML(tp, o, true); });
    });
    html += _rmPieHTML();
    const canvas = await _rmCanvasDe(_rmDOMBase(html, '14px'));
    canvas.toBlob(function(blob){
      if(!blob){ toast('No se pudo generar la imagen', true); return; }
      _entregarImagen(blob, 'Reporte_'+_rmCliente.replace(/[^\w]+/g,'_')+'_'+mes);
    }, 'image/png');
  }catch(err){ toast('Error al generar la imagen: '+err.message, true); }
}
async function rmCompartirPDF(){
  try{
    const mes = _rmMes||horMesActual();
    const datos = _rmOrdenes(_rmCliente, mes);
    if(!datos.total) return;
    toast('Generando PDF…');
    await _cargarHtml2Canvas();
    await _cargarJsPDF();
    const jsPDF = window.jspdf.jsPDF;
    const pdf = new jsPDF({unit:'mm', format:'letter'});
    const margen = 12;
    const anchoMM = pdf.internal.pageSize.getWidth() - margen*2;
    const altoPag = pdf.internal.pageSize.getHeight();
    let yMM = margen;
    const poner = async function(html){
      const c = await _rmCanvasDe(_rmDOMBase(html));
      const cMM = c.height / (c.width / anchoMM);
      if(yMM + cMM > altoPag - margen){ pdf.addPage(); yMM = margen; }
      pdf.addImage(c.toDataURL('image/jpeg',0.92), 'JPEG', margen, yMM, anchoMM, cMM);
      yMM += cMM;
    };
    await poner(_rmHeaderHTML(datos, mes));
    for(let t=0; t<_RM_TIPOS.length; t++){
      const tp = _RM_TIPOS[t];
      const lista = datos[tp.k];
      if(!lista.length) continue;
      await poner(_rmSeccionTituloHTML(tp, lista.length));
      for(let i=0;i<lista.length;i++) await poner(_rmCardHTML(tp, lista[i], true));
    }
    await poner(_rmPieHTML());
    const nombre = 'Reporte_'+_rmCliente.replace(/[^\w]+/g,'_')+'_'+mes;
    const blob = pdf.output('blob');
    try{
      const file = new File([blob], nombre+'.pdf', {type:'application/pdf'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: nombre});
        toast('📄 PDF compartido ✓');
        return;
      }
    }catch(err){ if(err && err.name==='AbortError') return; }
    const url = URL.createObjectURL(blob);
    const w = window.open(url, '_blank');
    if(w){ toast('📄 PDF abierto en otra pestaña'); }
    else { const a=document.createElement('a'); a.href=url; a.download=nombre+'.pdf'; a.click(); toast('📄 PDF generado'); }
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }catch(err){ toast('Error al generar el PDF: '+err.message, true); }
}

function lgVista(v){
  const sh=document.getElementById('seg-hor'), sr=document.getElementById('seg-rc');
  const ch=document.getElementById('hor-cont'), cr=document.getElementById('rc-cont');
  if(v==='rc'){ sr.classList.add('on'); sh.classList.remove('on'); cr.style.display='block'; ch.style.display='none'; renderCobros('rc-cont'); }
  else { sh.classList.add('on'); sr.classList.remove('on'); ch.style.display='block'; cr.style.display='none'; renderHorometros('hor-cont'); }
  window.scrollTo(0,0);
}
